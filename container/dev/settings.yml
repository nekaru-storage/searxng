#
# Settings used by ``container/docker-compose.dev.yml``.
use_default_settings: true

general:
  debug: true
  instance_name: "SearXNG dev"

search:
  formats:
    - html
    - json

server:
  secret_key: "dev-only-secret-key"
  limiter: false

# the dogpile engines are ``inactive`` in the default settings
engines:
  - name: dogpile
    inactive: false
  - name: dogpile images
    inactive: false
  - name: dogpile videos
    inactive: false
  - name: dogpile news
    inactive: false
